<?xml version="1.0" encoding="UTF-8"?>
<!--
  Palette reason: the subject is a cost ledger for flaky tests. Neutral slate
  ink (#1f2933) carries the labels and axis, a flat teal (#0f6e6e) fills the
  bars because teal reads as a measured, accounting colour rather than an
  alarm, and a single amber accent (#b45309) marks the one test that costs the
  most, which is where the reader should look first. Two colours plus one
  accent, no gradient, no glow.
  Numbers: produced by `flakeledger cost samples` with default rates
  (compute 0.008 USD/min, dev 1.50 USD/min, 15 dev min per flaky event).
    test_apply_coupon   total 45.0002 USD
    test_replica_catchup total 22.5006 USD
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img"
     aria-labelledby="title desc" font-family="-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif">
  <title id="title">Flake tax: cost per flaky test</title>
  <desc id="desc">
    Horizontal bar chart ranking two flaky tests by total attributed cost in
    US dollars, computed by the flakeledger cost command on the sample runs
    using the default rates. test_apply_coupon costs 45.00 dollars over 2
    flaky events. test_replica_catchup costs 22.50 dollars over 1 flaky event.
  </desc>

