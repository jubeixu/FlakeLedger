<?xml version="1.0" encoding="UTF-8"?>
<!--
  Palette reason: the subject is a cost ledger for flaky tests. Neutral slate
  ink (#1f2933) carries the labels and axis, a flat teal (#0f6e6e) fills the
  bars because teal reads as a measured, accounting colour rather than an
  alarm, and a single amber accent (#b45309) marks the one test that costs the
  most, which is where the reader should look first. Two colours plus one
  accent, no gradient, no glow.
  Numbers: produced by `flakeledger cost samples` with default rates
  (compute 0.008 USD/min, dev 1.50 USD/min, 15 dev min per flaky event).
    test_apply_coupon   total 45.0002 USD
    test_replica_catchup total 22.5006 USD
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img"
     aria-labelledby="title desc" font-family="-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif">
  <title id="title">Flake tax: cost per flaky test</title>
  <desc id="desc">
    Horizontal bar chart ranking two flaky tests by total attributed cost in
    US dollars, computed by the flakeledger cost command on the sample runs
    using the default rates. test_apply_coupon costs 45.00 dollars over 2
    flaky events. test_replica_catchup costs 22.50 dollars over 1 flaky event.
  </desc>

  <rect x="0" y="0" width="640" height="300" fill="#ffffff"/>

  <text x="24" y="34" font-size="17" font-weight="600" fill="#1f2933">Flake tax: total cost per flaky test</text>
  <text x="24" y="54" font-size="12" fill="#1f2933">Default rates: compute 0.008 USD/min, developer 1.50 USD/min, 15 dev min per flaky event.</text>

  <!-- Plot area. Bars start at x=250. Scale: 45.0002 USD maps to 340px. -->
  <!-- pixels per USD = 340 / 45.0002 = 7.5555 -->

  <!-- Bar 1: test_apply_coupon, 45.0002 USD, amber accent (highest cost). -->
  <text x="242" y="104" font-size="12" text-anchor="end" fill="#1f2933"
        font-family="&quot;Cascadia Mono&quot;, &quot;JetBrains Mono&quot;, Consolas, &quot;DejaVu Sans Mono&quot;, monospace">test_apply_coupon</text>
  <rect x="250" y="90" width="340" height="24" fill="#b45309"/>
  <text x="598" y="107" font-size="12" fill="#1f2933">45.00 USD</text>

  <!-- Bar 2: test_replica_catchup, 22.5006 USD, teal. 22.5006 * 7.5555 = 170px. -->
  <text x="242" y="154" font-size="12" text-anchor="end" fill="#1f2933"
        font-family="&quot;Cascadia Mono&quot;, &quot;JetBrains Mono&quot;, Consolas, &quot;DejaVu Sans Mono&quot;, monospace">test_replica_catchup</text>
  <rect x="250" y="140" width="170" height="24" fill="#0f6e6e"/>
  <text x="428" y="157" font-size="12" fill="#1f2933">22.50 USD</text>

  <!-- Axis line and ticks along the bottom of the plot. -->
  <line x1="250" y1="200" x2="590" y2="200" stroke="#1f2933" stroke-width="1"/>
  <!-- 0 -->
  <line x1="250" y1="200" x2="250" y2="206" stroke="#1f2933" stroke-width="1"/>
  <text x="250" y="222" font-size="11" text-anchor="middle" fill="#1f2933">0</text>
  <!-- 15 USD at 250 + 15*7.5555 = 363.3 -->
  <line x1="363" y1="200" x2="363" y2="206" stroke="#1f2933" stroke-width="1"/>
  <text x="363" y="222" font-size="11" text-anchor="middle" fill="#1f2933">15</text>
  <!-- 30 USD at 250 + 30*7.5555 = 476.7 -->
  <line x1="477" y1="200" x2="477" y2="206" stroke="#1f2933" stroke-width="1"/>
  <text x="477" y="222" font-size="11" text-anchor="middle" fill="#1f2933">30</text>
  <!-- 45 USD at 250 + 45*7.5555 = 590 -->
  <line x1="590" y1="200" x2="590" y2="206" stroke="#1f2933" stroke-width="1"/>
  <text x="590" y="222" font-size="11" text-anchor="middle" fill="#1f2933">45</text>

  <text x="420" y="248" font-size="12" text-anchor="middle" fill="#1f2933">Total attributed cost (US dollars)</text>
</svg>

# draft note 51
