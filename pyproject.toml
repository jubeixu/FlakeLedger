[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flakeledger"
version = "0.1.0"
description = "Quantify the compute and developer time cost of flaky tests from JUnit XML."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "FlakeLedger contributors" }]
